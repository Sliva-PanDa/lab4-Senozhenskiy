name: Build Lab 4 Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.0

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./SciencePortalMVC

    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./SciencePortalMVC

    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: ./SciencePortalMVC